services:
  brain:
    build:
      context: ../..
      dockerfile: deploy/brain/Dockerfile
    image: open-nexus/brain:local
    environment:
      BRAIN_HOST: 0.0.0.0
      BRAIN_PORT: 4317
      BRAIN_VERSION: 0.1.0
      BRAIN_AI_PROVIDER: fake
      BRAIN_DATA_DIR: /data
      # DISCORD_WEBHOOK_URL: https://discord.com/api/webhooks/...
    ports:
      - "4317:4317"
    volumes:
      - ./data:/data
    restart: unless-stopped
